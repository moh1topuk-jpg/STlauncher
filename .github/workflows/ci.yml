name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore STlauncher.sln

      - name: Build
        run: dotnet build STlauncher.sln -c Release --no-restore

      - name: Test
        run: dotnet test STlauncher.sln -c Release --no-build

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write      # create the release
      id-token: write      # provenance attestation (OIDC)
      attestations: write  # provenance attestation
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish
        run: >
          dotnet publish src/STlauncher.App -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -o publish

      # Optional Authenticode signing. Runs only when a certificate is provided
      # through the CODE_SIGNING_CERT_BASE64 / CODE_SIGNING_CERT_PASSWORD secrets.
      # See docs/SIGNING.md.
      - name: Prepare signing certificate
        shell: pwsh
        env:
          CERT_BASE64: ${{ secrets.CODE_SIGNING_CERT_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CERT_BASE64)) {
            Write-Host "No signing certificate configured - skipping."
            exit 0
          }
          [IO.File]::WriteAllBytes("$PWD/signing.pfx", [Convert]::FromBase64String($env:CERT_BASE64))
          Write-Host "Certificate written to signing.pfx"

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk

      - name: Pack
        shell: pwsh
        env:
          CERT_PASSWORD: ${{ secrets.CODE_SIGNING_CERT_PASSWORD }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $sign = @()
          if (Test-Path "signing.pfx") {
            Write-Host "Packing with Authenticode signing."
            $sign = @('--signParams', "/f signing.pfx /p $env:CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256")
          } else {
            Write-Host "No certificate configured - packing unsigned."
          }
          vpk pack -u STlauncher -v $version -p publish -e STlauncher.App.exe -o releases @sign

      - name: Remove signing certificate
        if: always()
        shell: pwsh
        run: Remove-Item -LiteralPath signing.pfx -Force -ErrorAction SilentlyContinue

      - name: Upload release
        shell: pwsh
        run: >
          vpk upload github -o releases -r ${{ github.repository }}
          -t ${{ secrets.GITHUB_TOKEN }}
          --publish --releaseName "STlauncher ${{ github.ref_name }}"
          --tag ${{ github.ref_name }}

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem releases -File |
            Where-Object { $_.Extension -in '.exe', '.nupkg', '.msi', '.zip' } |
            Sort-Object Name |
            ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } |
            Set-Content releases/SHA256SUMS.txt
          Get-Content releases/SHA256SUMS.txt

      - name: Attach checksums to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.ref_name }} releases/SHA256SUMS.txt --clobber

      # Free cryptographic proof that the artifacts were built by this workflow
      # from this repository. Verify with: gh attestation verify <file> -R <owner/repo>
      - name: Attest build provenance
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            releases/*.exe
            releases/*.nupkg
