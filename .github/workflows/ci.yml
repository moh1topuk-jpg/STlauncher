name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore STlauncher.sln

      - name: Build
        run: dotnet build STlauncher.sln -c Release --no-restore

      - name: Test
        run: dotnet test STlauncher.sln -c Release --no-build

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish
        run: >
          dotnet publish src/STlauncher.App -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -o publish

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk

      - name: Pack
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          vpk pack -u STlauncher -v $version -p publish -e STlauncher.App.exe -o releases

      - name: Upload release
        shell: pwsh
        run: >
          vpk upload github -o releases -r ${{ github.repository }}
          -t ${{ secrets.GITHUB_TOKEN }}
          --publish --releaseName "STlauncher ${{ github.ref_name }}"
          --tag ${{ github.ref_name }}
