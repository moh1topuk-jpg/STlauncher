name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore STlauncher.sln

      - name: Build
        run: dotnet build STlauncher.sln -c Release --no-restore

      - name: Test
        run: dotnet test STlauncher.sln -c Release --no-build

  # Linux is built and tested on every push so the port never rots, but nothing is
  # published: there is no player on Linux yet to try it. The AppImage is an artifact
  # of the run. See docs/platforms.md.
  build-linux:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Test on Linux
        run: dotnet test STlauncher.sln -c Release

      - name: Publish linux-x64
        run: >
          dotnet publish src/STlauncher.App -c Release -r linux-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -o publish

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk --version 1.2.0

      - name: Pack AppImage
        run: |
          version=$(grep -oP '(?<=<Version>)[^<]+' src/STlauncher.App/STlauncher.App.csproj)
          vpk pack -u STlauncher -v "$version" -p publish -e STlauncher.App -o releases-linux -i src/STlauncher.App/Assets/app.png

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: STlauncher-linux-x64
          path: releases-linux/
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write      # create the release
      id-token: write      # provenance attestation (OIDC)
      attestations: write  # provenance attestation
    steps:
      - uses: actions/checkout@v4

      # The changelog is the release notes. A tag with no section for its version fails
      # here, before anything is published: that is what keeps CHANGELOG.md from falling
      # behind the releases.
      - name: Release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $lines = Get-Content CHANGELOG.md -Encoding utf8
          $heading = '^## \[' + [regex]::Escape($version) + '\]'
          $index = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match $heading) { $index = $i; break }
          }
          if ($index -lt 0) {
            Write-Error "CHANGELOG.md has no section for $version. Add '## [$version]' before tagging."
            exit 1
          }
          $body = @()
          for ($i = $index + 1; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^## \[' -or $lines[$i] -match '^\[[^\]]+\]:\s') { break }
            $body += $lines[$i]
          }
          $text = ($body -join "`n").Trim()
          if ([string]::IsNullOrWhiteSpace($text)) {
            Write-Error "The CHANGELOG.md section for $version is empty."
            exit 1
          }
          $text += "`n`n**Установщик:** [STlauncher-win-Setup.exe](https://showtime-updates.moh1topuk.workers.dev/STlauncher-win-Setup.exe) — работает и без доступа к GitHub. Установщик один на несколько версий: после установки лаунчер сам обновится до этой."
          Set-Content release-notes.md $text -Encoding utf8
          Get-Content release-notes.md -Encoding utf8

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish
        run: >
          dotnet publish src/STlauncher.App -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -o publish

      # Pinned: an unattended CLI upgrade changed flag names before and silently broke
      # publishing, which is exactly the kind of failure nobody notices until a release
      # never appears.
      - name: Install Velopack CLI
        run: dotnet tool install -g vpk --version 1.2.0

      - name: Pack
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          vpk pack -u STlauncher -v $version -p publish -e STlauncher.App.exe -o releases --releaseNotes release-notes.md

      # --repoUrl takes a full URL (there is no -r shorthand any more), and --publish
      # takes an explicit value. The old "-r owner/repo ... --publish" form failed here.
      - name: Upload release
        shell: pwsh
        run: >
          vpk upload github -o releases
          --repoUrl https://github.com/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }}
          --publish true
          --releaseName "STlauncher ${{ github.ref_name }}"
          --tag ${{ github.ref_name }}

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem releases -File |
            Where-Object { $_.Extension -in '.exe', '.nupkg', '.msi', '.zip' } |
            Sort-Object Name |
            ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } |
            Set-Content releases/SHA256SUMS.txt
          Get-Content releases/SHA256SUMS.txt

      - name: Attach checksums and notes to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} releases/SHA256SUMS.txt --clobber
          gh release edit ${{ github.ref_name }} --notes-file release-notes.md

      # Free cryptographic proof that the artifacts were built by this workflow
      # from this repository. Verify with: gh attestation verify <file> -R <owner/repo>
      - name: Attest build provenance
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            releases/*.exe
            releases/*.nupkg
